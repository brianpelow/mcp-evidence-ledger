[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-evidence-ledger"
version = "0.1.0"
description = "Append-only, hash-chained evidence ledger as an MCP server"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Brian Pelow" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]
mcp = [
    "mcp>=1.0.0",
]

[project.scripts]
evidence-ledger = "ledger.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ledger"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# C408: dict() builder in tests. BLE001: the head-cache fallback deliberately
# catches any corruption and rebuilds from the log. SIM113: the explicit chain
# position counter is clearer than enumerate in the verifier.
ignore = ["C408", "BLE001", "SIM113"]

[tool.pytest.ini_options]
testpaths = ["tests"]